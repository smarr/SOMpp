name: Tests

on: [push, pull_request]

jobs:
  test_soms:
    name: Run (Compiler=${{matrix.compiler}} GC=${{matrix.gc}}
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false # we want all jobs to run, because they may fail independently
      matrix:
        compiler: [clang, gcc]
        gc: [PAGED_MARK_SWEEP, DSW_PAGED_MARK_SWEEP]

    steps:
      - name: Checkout SOM Repository
        uses: actions/checkout@v6

      - name: Install Apt Packages
        run: |
          sudo apt-get install libcppunit-dev

      - name: Install Clang 22
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main"
          sudo apt-get update
          for i in 1 2 3; do
            sudo apt-get install -y clang-22 clang-tidy-22 && break
            sleep 17
          done
        if: matrix.compiler == 'clang'

      - name: Install Clang Format
        run: sudo apt-get install -y clang-format-22
        if: matrix.compiler == 'clang' && matrix.gc == 'GENERATIONAL'

      - name: Build SOM VM
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]
          then
            export CC=clang-22
            export CXX=clang++-22
          else
            export CC=gcc
            export CXX=g++
          fi
          echo $CC $CXX
          mkdir cmake-build
          cd cmake-build
          echo cmake .. -DGC_TYPE=${{ matrix.gc}} -DCMAKE_BUILD_TYPE=Debug
          cmake .. -DGC_TYPE=${{ matrix.gc}} -DCMAKE_BUILD_TYPE=Debug
          make -j5

      - name: Run Unit Tests
        run: |
          cd cmake-build
          ./unittests -cp ../Smalltalk:../TestSuite/BasicInterpreterTests ../Examples/Hello.som
          ./SOM++ -prim-hash-check -cp ../Smalltalk ../Examples/Benchmarks/BenchmarkHarness.som VectorBenchmark 1 1

      - name: Run Tests on SOM VM
        run: |
          cd cmake-build
          ./SOM++ -cp ../Smalltalk ../TestSuite/TestHarness.som

      - name: Integration Tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          export VM=./cmake-build/SOM++
          export CLASSPATH=Smalltalk
          export AWFY=core-lib/Examples/AreWeFastYet/Core
          export TEST_EXPECTATIONS=./integration-tests.yml
          pytest core-lib/IntegrationTests

      - name: Clang Tidy
        if: matrix.compiler == 'clang'
        run: |
          cd cmake-build
          make check-tidy

      - name: Clang Format
        if: matrix.compiler == 'clang' && matrix.gc == 'GENERATIONAL'
        run: |
          cd cmake-build
          make check-format

  build_from_archive:
    name: Check Building the Source Archive
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout SOM Repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Apt Packages
        run: |
          sudo apt-get install libcppunit-dev

      - name: Create and Extract Archive
        run: |
          mkdir archive
          .github/archive.sh archive
          # tar -xzf archive/SOMpp-*.tar.gz -C archive

      # - name: Build and Test Debug Build from Archive
      #   run: |
      #     cd archive/SOMpp-*/
      #     mkdir cmake-build
      #     cd cmake-build
      #     cmake .. -DCMAKE_BUILD_TYPE=Debug
      #     make -j5
      #     ./unittests -cp ../Smalltalk:../TestSuite/BasicInterpreterTests ../Examples/Hello.som
      #     ./SOM++ -cp ../Smalltalk ../TestSuite/TestHarness.som

      - name: Upload tar.gz
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP }}
          archive: false
          if-no-files-found: error
